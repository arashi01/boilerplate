name: "Integration Build"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    tags: [v*]
    paths-ignore:
      - "**.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JDK_RELEASE: 21
  JDK_CURRENT: 25
  NODE_LTS: 22
  SBT_OPTS: >-
    -Xmx7G
    -Xss4M
    -XX:ReservedCodeCacheSize=512M

jobs:
  test_jvm:
    name: "[JVM: jdk-${{ matrix.java }}] TEST"
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      - name: Test
        run: sbt "boilerplate-aggregate/test"

      - name: Package
        run: sbt "boilerplate-aggregate/package"

      - name: Stage Release Artefacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == env.JDK_RELEASE
        run: sbt "boilerplate-aggregate/publish"

      - name: Upload Staging Tree
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == env.JDK_RELEASE
        uses: actions/upload-artifact@v7
        with:
          name: staging-jvm
          path: target/sona-staging/**
          retention-days: 1
          if-no-files-found: error

  test_js:
    name: "[JS: node-${{ matrix.node }}] TEST"
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      - name: Test
        run: sbt "boilerplate-aggregateJS/test"

      - name: Package
        run: sbt "boilerplate-aggregateJS/package"

      - name: Stage Release Artefacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.node == env.NODE_LTS
        run: sbt "boilerplate-aggregateJS/publish"

      - name: Upload Staging Tree
        if: startsWith(github.ref, 'refs/tags/v') && matrix.node == env.NODE_LTS
        uses: actions/upload-artifact@v7
        with:
          name: staging-js
          path: target/sona-staging/**
          retention-days: 1
          if-no-files-found: error

  test_native:
    name: "[Native: ${{ matrix.target }}]"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-26.04
          - target: linux-aarch_64
            runner: ubuntu-26.04-arm
          - target: osx-aarch_64
            runner: macos-26
          - target: windows-x86_64
            runner: windows-2025-vs2026
            vsarch: amd64
          - target: windows-aarch_64
            runner: windows-11-vs2026-arm
            vsarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      # vcvarsall imports the MSVC build environment for the target arch; LLVM_BIN points Scala Native's
      # discovery at MSVCs clang ensuring the correct ABI
      - name: Set up MSVC toolchain (Windows)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        env:
          VSARCH: ${{ matrix.vsarch }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $env:VSARCH && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" } } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sub = if ($env:VSARCH -eq 'arm64') { 'arm64' } else { 'x64' }
          "LLVM_BIN=$vs\VC\Tools\Llvm\$sub\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        shell: bash
        run: sbt "boilerplate-aggregateNative/test"

      # Stage native artefacts UNSIGNED on a release tag; the release job signs the merged tree
      # centrally on Linux (the Windows VS2026 images have no gpg).
      - name: Stage Native Artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sbt "boilerplate-aggregateNative/publish"

      - name: Upload Staging Tree
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: staging-${{ matrix.target }}
          path: target/sona-staging/**
          retention-days: 1
          if-no-files-found: error

  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JDK_CURRENT }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      - name: Verify Source Formatting
        id: scalafmt
        continue-on-error: true
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"

      - name: Verify Linting Conformity
        id: scalafix
        continue-on-error: true
        run: sbt "scalafixAll --check"

      - name: Verify File Header Conformity
        id: headers
        continue-on-error: true
        run: sbt headerCheckAll

      - name: Check for failures
        if: always()
        run: |
          failed=""
          [[ "${{ steps.scalafmt.outcome }}" == "failure" ]] && failed="$failed scalafmtCheckAll"
          [[ "${{ steps.scalafix.outcome }}" == "failure" ]] && failed="$failed scalafixAll"
          [[ "${{ steps.headers.outcome }}" == "failure" ]] && failed="$failed headerCheckAll"
          if [[ -n "$failed" ]]; then
            echo "::error::Static analysis checks failed:$failed"
            exit 1
          fi

  snapshot:
    name: Publish Snapshot
    needs:
      - test_jvm
      - test_js
      - test_native
      - static_analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      # Snapshots publish straight to central-snapshots (publishTo handles routing). boilerplate-native
      # publishes only linux-x86_64 classifier; the full matrix is published for tagged releases only.
      - name: Publish Snapshot
        run: sbt "publish"
        env:
          SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.PUBLISH_USER_PASSPHRASE }}

  release:
    name: Publish Release
    needs:
      - test_jvm
      - test_js
      - test_native
      - static_analysis
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      # Merge every staged tree (the JVM tree, the JS tree, and all native trees) into the single
      # Sonatype staging directory sonaRelease zips and uploads.
      - name: Collect Staged Artefacts
        uses: actions/download-artifact@v8
        with:
          path: target/sona-staging
          pattern: staging-*
          merge-multiple: true

      - name: Verify Staging Populated
        run: |
          if [[ -z "$(ls -A target/sona-staging 2>/dev/null)" ]]; then
            echo "::error::no staged artefacts were collected"
            exit 1
          fi
          find target/sona-staging -name '*.jar' | sort

      - name: Import Signing Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.SIGNING_KEY }}
          trust_level: 5

      # Sign the merged staging tree and checksum everything in for Central deployment.
      - name: Sign and Checksum Staged Artefacts
        run: |
          set -euo pipefail
          # Sign artefacts (never the checksums or signatures themselves).
          find target/sona-staging -type f \
            \! -name '*.asc' \! -name '*.md5' \! -name '*.sha1' \
            -exec gpg --batch --yes --armor --detach-sign {} \;
          # Checksum every deployed file, including the freshly-created .asc.
          find target/sona-staging -type f \! -name '*.md5' \! -name '*.sha1' | while IFS= read -r f; do
            md5sum "$f" | cut -d ' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d ' ' -f1 > "$f.sha1"
          done

      # Single deployment: zip the merged, signed staging tree and upload-and-publish in one shot.
      - name: Release to Central Portal
        run: sbt "sonaRelease"
        env:
          SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.PUBLISH_USER_PASSPHRASE }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            $prerelease_flag

  dependency-graph:
    name: Update Dependency Graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_CURRENT }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Submit Dependency Graph
        uses: scalacenter/sbt-dependency-submission@v3
