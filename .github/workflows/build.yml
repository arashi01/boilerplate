name: "ci"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    tags: [v*]
    paths-ignore:
      - "**.md"

# Superseded runs are cancelled on PR branches only: cancelling a superseded `main` run skips that
# commit's snapshot publish (`publish` needs the cancelled jobs), and a cancelled tag run is a
# cancelled release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JDK_RELEASE: 21
  JDK_CURRENT: 25
  NODE_LTS: 22
  SBT_OPTS: >-
    -Xmx7G
    -Xss4M
    -XX:ReservedCodeCacheSize=512M

jobs:
  test_jvm:
    name: "jvm / jdk-${{ matrix.java }} / test"
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      - name: Test
        run: sbt --server "boilerplate-aggregate/test"

      - name: Package
        run: sbt --server "boilerplate-aggregate/package"

      - name: Stage Release Artefacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == env.JDK_RELEASE
        run: sbt --server "boilerplate-aggregate/publish"

      - name: Upload Staging Tree
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == env.JDK_RELEASE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-jvm
          path: target/sona-staging/**
          retention-days: 1
          if-no-files-found: error

  test_js:
    name: "js / node-${{ matrix.node }} / test"
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      - name: Test
        run: sbt --server "boilerplate-aggregateJS/test"

      - name: Package
        run: sbt --server "boilerplate-aggregateJS/package"

      - name: Stage Release Artefacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.node == env.NODE_LTS
        run: sbt --server "boilerplate-aggregateJS/publish"

      - name: Upload Staging Tree
        if: startsWith(github.ref, 'refs/tags/v') && matrix.node == env.NODE_LTS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-js
          path: target/sona-staging/**
          retention-days: 1
          if-no-files-found: error

  test_native:
    name: "native / ${{ matrix.target }} / test"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-26.04
          - target: linux-aarch_64
            runner: ubuntu-26.04-arm
          - target: osx-aarch_64
            runner: macos-26
          - target: windows-x86_64
            runner: windows-2025-vs2026
            vsarch: amd64
          - target: windows-aarch_64
            runner: windows-11-vs2026-arm
            vsarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      # vcvarsall imports the MSVC build environment for the target arch; LLVM_BIN points Scala Native's
      # discovery at MSVCs clang ensuring the correct ABI
      - name: Set up MSVC toolchain (Windows)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        env:
          VSARCH: ${{ matrix.vsarch }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $env:VSARCH && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" } } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sub = if ($env:VSARCH -eq 'arm64') { 'arm64' } else { 'x64' }
          "LLVM_BIN=$vs\VC\Tools\Llvm\$sub\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        shell: bash
        run: sbt --server "boilerplate-aggregateNative/test"

      # Stage native artefacts UNSIGNED on a release tag; the release job signs the merged tree centrally
      # on Linux (the Windows VS2026 images have no gpg). Each artefact is published from exactly one
      # place: every native job emits its own classified boilerplate-native jar (a unique OS/arch
      # coordinate), while the platform-independent UNCLASSIFIED native libs (core/effect) are
      # published once, from linux-x86_64 only.
      - name: Stage Native Artefacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux-x86_64" ]; then
            sbt --server "boilerplate-aggregateNative/publish"   # unclassified native libs + linux-x86_64 classifier
          else
            sbt --server "boilerplate-native/publish"            # this platform's classifier only
          fi

      - name: Upload Staging Tree
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-${{ matrix.target }}
          path: target/sona-staging/**
          retention-days: 1
          if-no-files-found: error

  static_analysis:
    name: analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JDK_CURRENT }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      - name: Verify Source Formatting
        id: scalafmt
        continue-on-error: true
        run: sbt --server "scalafmtCheckAll; scalafmtSbtCheck"

      - name: Verify Linting Conformity
        id: scalafix
        continue-on-error: true
        run: sbt --server "scalafixAll --check"

      - name: Verify File Header Conformity
        id: headers
        continue-on-error: true
        run: sbt headerCheckAll

      - name: Check for failures
        if: always()
        run: |
          failed=""
          [[ "${{ steps.scalafmt.outcome }}" == "failure" ]] && failed="$failed scalafmtCheckAll"
          [[ "${{ steps.scalafix.outcome }}" == "failure" ]] && failed="$failed scalafixAll"
          [[ "${{ steps.headers.outcome }}" == "failure" ]] && failed="$failed headerCheckAll"
          if [[ -n "$failed" ]]; then
            echo "::error::Static analysis checks failed:$failed"
            exit 1
          fi

  snapshot:
    name: "publish / snapshot"
    needs:
      - test_jvm
      - test_js
      - test_native
      - static_analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      # Snapshots publish straight to central-snapshots (publishTo handles routing). boilerplate-native
      # publishes only linux-x86_64 classifier; the full matrix is published for tagged releases only.
      - name: Publish Snapshot
        run: sbt --server "publish"
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}

  release:
    name: "publish / release"
    needs:
      - test_jvm
      - test_js
      - test_native
      - static_analysis
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_RELEASE }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_RELEASE }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      # Merge every staged tree (the JVM tree, the JS tree, and all native trees) into the single
      # Sonatype staging directory sonaRelease zips and uploads.
      - name: Collect Staged Artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: target/sona-staging
          pattern: staging-*
          merge-multiple: true

      - name: Verify Staging Populated
        run: |
          if [[ -z "$(ls -A target/sona-staging 2>/dev/null)" ]]; then
            echo "::error::no staged artefacts were collected"
            exit 1
          fi
          find target/sona-staging -name '*.jar' | sort

      - name: Import Signing Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY }}
          trust_level: 5

      # Sign the merged staging tree and checksum everything in for Central deployment.
      - name: Sign and Checksum Staged Artefacts
        run: |
          set -euo pipefail
          # Sign artefacts (never the checksums or signatures themselves).
          find target/sona-staging -type f \
            \! -name '*.asc' \! -name '*.md5' \! -name '*.sha1' \
            -exec gpg --batch --yes --armor --detach-sign {} \;
          # Checksum every deployed file, including the freshly-created .asc.
          find target/sona-staging -type f \! -name '*.md5' \! -name '*.sha1' | while IFS= read -r f; do
            md5sum "$f" | cut -d ' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d ' ' -f1 > "$f.sha1"
          done

      # Single deployment: zip the merged, signed staging tree and upload-and-publish in one shot.
      - name: Release to Central Portal
        run: sbt --server "sonaRelease"
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}

      # Mint an org release-bot token so the GitHub Release is created under the Shuwari Africa app
      # identity (org-scoped provenance and permissions), not the ephemeral default GITHUB_TOKEN actor.
      - name: Mint Release Bot Token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            $prerelease_flag

  dependency-graph:
    name: dependency-graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JDK_CURRENT }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: Set up sbt
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6

      - name: Submit Dependency Graph
        uses: scalacenter/sbt-dependency-submission@7b2f7e1418cb4a77fee99f9eb07c3f7577b9a867 # v3
