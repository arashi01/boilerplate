version = "3.11.5"
runner.dialect = scala3
lineEndings = unix
maxColumn = 140

indent.defnSite = 2
indent.extraBeforeOpenParenDefnSite = 2

align.stripMargin = true
align.arrowEnumeratorGenerator = true
align.openParenCallSite = true
align.openParenDefnSite = false
align.openBracketDefnSite = false

danglingParentheses.preset = true
danglingParentheses.defnSite = false
danglingParentheses.callSite = true

newlines.avoidInResultType = true
newlines.sometimesBeforeColonInMethodReturnType = false
newlines.avoidForSimpleOverflow = [tooLong, punct, slc]

assumeStandardLibraryStripMargin = true

rewrite.rules = [AvoidInfix, PreferCurlyFors, RedundantBraces, RedundantParens, SortModifiers]
rewrite.scala3.insertEndMarkerMinLines = 12
rewrite.scala3.removeEndMarkerMaxLines = 10
rewrite.scala3.removeOptionalBraces = true
rewrite.scala3.convertToNewSyntax = true

docstrings.style = SpaceAsterisk
docstrings.removeEmpty = true
docstrings.oneline = fold
docstrings.wrap = fold
docstrings.wrapMaxColumn = 100
docstrings.blankFirstLine = fold
docstrings.forceBlankLineBefore = true

# scalameta, which scalafmt parses with, does not read capture-checking syntax (`Slice^`) and fails
# on any file carrying it. Those files are withheld until it does; the compiler still checks them
# under the full flag set, and the standard still governs them - being unformatted by the tool is
# not licence to drift. build.sbt withholds the same set from scalafix, for the same reason, and
# `checkCaptureCheckedExclusions` fails the build if the two lists diverge.
project.excludeFilters = [
  "modules/core/src/main/scala/boilerplate/Secret.scala",
  "modules/core/src/main/scala/boilerplate/SliceError.scala",
  "modules/core/src/main/scala/boilerplate/UUID.scala",
  "modules/core/src/main/scalajs/boilerplate/Slice.scala",
  "modules/core/src/main/scalajvm/boilerplate/Slice.scala",
  "modules/core/src/main/scalanative/boilerplate/Slice.scala",
  "modules/core/src/test/scala/boilerplate/SecretBorrowSuite.scala",
  "modules/core/src/test/scalanative/boilerplate/SliceBorrowSuite.scala",
  "modules/effect/src/main/scala/boilerplate/effect/borrowing.scala"
]

# sbt 2 compiles build definitions and the meta-build with Scala 3, so they are formatted as Scala 3
# - a scala212source3 dialect here rejects `given`, `if ... then`, and the rest of the syntax the
# build is entitled to use.
fileOverride {
  "glob:**.sbt" {
    runner.dialect = scala3
    newlines.beforeOpenParenCallSite = null
  }
  "glob:**/project/**.*" {
    runner.dialect = scala3
    newlines.beforeOpenParenCallSite = null
  }
}
